<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harness Workflow Dashboard</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/assets/dashboard.css">
    <style>
      /* DDD diagrams are rendered in the candidate design document; hide the duplicate live panel before it can paint. */
      .workflow-page .ddd-live-preview { display: none; }
      .final-design-result { margin-top: 1rem; }
      .final-design-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr)); }
      .final-design-result details { border: 1px solid var(--border, #d8d8d8); border-radius: .5rem; padding: .75rem; background: var(--surface, #fff); }
      .final-design-result summary { cursor: pointer; font-weight: 600; }
      .final-design-result .mermaid { overflow: auto; }
    </style>
  </head>
  <body>
    <header class="masthead">
      <div>
        <p class="eyebrow">Harness workflow</p>
        <h1>Document Dashboard</h1>
      </div>
      <div class="toolbar">
        <button id="dashboard-home">Dashboard</button>
        <button id="project-documents">Project Map</button>
        <button id="app-runtime">App Runtime</button>
        <button id="new-change-set" class="primary">New ChangeSet</button>
        <p id="refresh-status">Loading workflow data...</p>
      </div>
    </header>
    <main class="layout">
      <aside class="sidebar">
        <h2>ChangeSets</h2>
        <div id="change-sets"></div>
      </aside>
      <section id="detail" class="detail"></section>
    </main>
    <script>
      const removeDuplicateDddVisualization = () => {
        document.querySelectorAll(".workflow-page .ddd-live-preview").forEach((panel) => panel.remove());
      };
      const workflowDetail = document.querySelector("#detail");
      new MutationObserver(removeDuplicateDddVisualization).observe(workflowDetail, { childList: true, subtree: true });
    </script>
    <script>
      (() => {
        let dashboardState = null;
        let mermaidPromise = null;
        const originalFetch = window.fetch.bind(window);
        const escapeHtml = (value) => String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
        const diagramSource = (markdown) => {
          const match = String(markdown ?? "").match(/```mermaid\s*\n([\s\S]*?)\n```/i);
          return match ? match[1] : "";
        };
        const selectedChangeSetId = () => document.querySelector(".change-button.selected")?.dataset.change || "";

        window.fetch = async (...args) => {
          const response = await originalFetch(...args);
          const request = args[0];
          const url = typeof request === "string" ? request : request?.url || "";
          if (url.includes("/api/dashboard")) {
            response.clone().json().then((payload) => {
              dashboardState = payload;
              requestAnimationFrame(renderFinalDesignResult);
            }).catch(() => {});
          }
          return response;
        };

        function renderFinalMermaid(root) {
          const nodes = [...root.querySelectorAll(".mermaid:not([data-final-mermaid-rendered])")];
          if (!nodes.length) return;
          if (!mermaidPromise) {
            mermaidPromise = import("https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs")
              .then((module) => {
                module.default.initialize({ startOnLoad: false, securityLevel: "strict" });
                return module.default;
              });
          }
          mermaidPromise
            .then((mermaid) => mermaid.run({ nodes }))
            .then(() => nodes.forEach((node) => { node.dataset.finalMermaidRendered = "true"; }))
            .catch(() => nodes.forEach((node) => { node.classList.add("mermaid-error"); }));
        }

        function renderFinalDesignResult() {
          const existing = document.querySelector("#final-design-result");
          const deliveryRefresh = document.querySelector("#refresh-delivery");
          if (!deliveryRefresh || !dashboardState) {
            existing?.remove();
            return;
          }
          const selected = (dashboardState.change_sets || []).find((item) => item.id === selectedChangeSetId());
          const diagrams = (selected?.final_design_visualizations || []).filter((item) => item.status === "verified");
          if (!diagrams.length) {
            existing?.remove();
            return;
          }
          const signature = diagrams.map((item) => item.uc_id).join(",");
          if (existing?.dataset.signature === signature) return;
          existing?.remove();
          const panel = document.createElement("section");
          panel.id = "final-design-result";
          panel.dataset.signature = signature;
          panel.className = "panel final-design-result";
          panel.innerHTML = `<p class="eyebrow">Final result</p>
            <h3>Verified Design Visualizations</h3>
            <p class="small">Class and flow diagrams generated by the verified Design Visualization stage.</p>
            ${diagrams.map((item) => {
              const classDiagram = diagramSource(item.class_diagram);
              const flowDiagram = diagramSource(item.flow_diagram);
              return `<article>
                <h4>${escapeHtml(item.uc_id)}</h4>
                <div class="final-design-grid">
                  <details open><summary>Class Diagram</summary><pre class="mermaid">${escapeHtml(classDiagram)}</pre></details>
                  <details open><summary>Flow Diagram</summary><pre class="mermaid">${escapeHtml(flowDiagram)}</pre></details>
                </div>
              </article>`;
            }).join("")}`;
          const anchor = deliveryRefresh.closest(".panel, section") || deliveryRefresh.parentElement;
          anchor?.insertAdjacentElement("afterend", panel);
          renderFinalMermaid(panel);
        }

        new MutationObserver(() => requestAnimationFrame(renderFinalDesignResult)).observe(
          workflowDetail,
          { childList: true, subtree: true }
        );
      })();
    </script>
    <script type="module" src="/assets/dashboard.js"></script>
    <script>
      (() => {
        const actionClass = "grill-panel-collapsed-action";
        const placeholderClass = "grill-panel-collapsed-action-placeholder";
        const actionSelector = ".grill-panel-body .next-stage";
        const style = document.createElement("style");
        style.textContent = `
          .grill-panel-collapsed-action { display: none; }
          .grill-panel.collapsed .grill-panel-collapsed-action {
            display: block;
            margin-top: 12px;
          }
        `;
        document.head.append(style);

        function moveCollapsedContinueActions() {
          document.querySelectorAll(".grill-panel").forEach((panel) => {
            const body = panel.querySelector(".grill-panel-body");
            const container = panel.querySelector(`.${actionClass}`);
            const movedAction = container?.querySelector(".next-stage");
            const placeholder = body?.querySelector(`.${placeholderClass}`);

            if (!body) return;
            if (!panel.classList.contains("collapsed")) {
              if (movedAction && placeholder) placeholder.replaceWith(movedAction);
              container?.remove();
              return;
            }

            const nextAction = movedAction || body.querySelector(actionSelector);
            if (!nextAction || movedAction) return;

            const marker = document.createElement("span");
            marker.className = placeholderClass;
            nextAction.before(marker);
            const actionContainer = container || document.createElement("div");
            actionContainer.className = actionClass;
            if (!container) panel.querySelector(".grill-panel-header")?.after(actionContainer);
            actionContainer.append(nextAction);
          });
        }

        new MutationObserver(moveCollapsedContinueActions).observe(document.body, {
          childList: true,
          subtree: true,
        });
        moveCollapsedContinueActions();
      })();
    </script>
  </body>
</html>
