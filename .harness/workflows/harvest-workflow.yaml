version: 1

workflow:
  name: harness-harvest-workflow
  mode: apply
  description: Harvest product intent into canonical requirements, ubiquitous language, then runtime-ready use-case documents.

sandbox:
  kind: worktree

steps:
  - id: harvest-requirements
    kind: agent
    name: Derive requirements from the initial product idea
    agent_id: harness_requirements
    skill_id: harness-requirements
    outputs:
      - docs/design/요구사항.md
    timeout_sec: 3600
    metadata:
      stage: harvest
      scope: canonical_requirements
      bootstrap_outputs:
        - AGENTS.md
        - docs/agent/context.md
        - docs/agent/commands.md
        - docs/agent/session-state.md
        - docs/agent/token-reduction-report.md
      output_gate:
        - docs/design/요구사항.md

  - id: confirm-ubiquitous-language
    kind: agent
    name: Confirm ubiquitous language through grill-me and write context.md
    agent_id: harness_requirements
    skill_id: harness-requirements
    needs:
      - harvest-requirements
    inputs:
      - docs/design/요구사항.md
    outputs:
      - context.md
    timeout_sec: 3600
    metadata:
      stage: harvest
      scope: ubiquitous_language
      language_gate:
        output: context.md
        section: Ubiquitous Language
        source: grill-me
      output_gate:
        - context.md

  - id: validate-context-language
    kind: validator
    name: Validate confirmed ubiquitous language before use-case harvest
    needs:
      - confirm-ubiquitous-language
    command: python3 -m harness_codex.context_language --repo-root .
    timeout_sec: 300
    inputs:
      - context.md
      - docs/design/요구사항.md
    metadata:
      stage: harvest
      scope: ubiquitous_language
      checks:
        - context.md exists
        - canonical terms are unique
        - required ubiquitous language table columns exist
        - forbidden terms do not appear in generated docs

  - id: harvest-use-cases
    kind: agent
    name: Derive runtime-ready use case docs from confirmed requirements and ubiquitous language
    agent_id: harness_usecases
    skill_id: harness-usecases
    needs:
      - validate-context-language
    inputs:
      - context.md
      - docs/design/요구사항.md
    outputs:
      - docs/design/유스케이스.md
      - docs/use-cases
    timeout_sec: 3600
    metadata:
      stage: harvest
      scope: runtime_ready_use_cases
      language_source: context.md
      slice_outputs:
        root: docs/use-cases
        required_per_use_case:
          - use-case.md
          - e2e-goal.md
      output_gate:
        - docs/design/유스케이스.md
        - docs/use-cases
