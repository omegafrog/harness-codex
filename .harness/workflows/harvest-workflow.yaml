version: 1

workflow:
  name: harness-harvest-workflow
  mode: apply
  description: Harvest product intent into canonical requirements and use-case documents.

sandbox:
  kind: worktree

steps:
  - id: harvest-requirements-use-cases
    kind: agent
    name: Derive requirements and use cases from the initial product idea
    agent_id: harness_requirements_usecases
    skill_id: harness-requirements-usecases
    outputs:
      - docs/design/요구사항.md
      - docs/design/유스케이스.md
    timeout_sec: 3600
    metadata:
      stage: harvest
      scope: canonical_design
      output_gate:
        - docs/design/요구사항.md
        - docs/design/유스케이스.md
