version: 1
workflow:
  name: changeset-work-item-workflow
  mode: apply
  description: Execute one selected ChangeSet work item through plan completion only.
sandbox:
  kind: worktree
steps:
- id: classify-maintenance-request
  kind: decision
  name: Classify the instruction as bug or maintenance
  inputs:
  - docs/changes/active
  metadata:
    stage: maintenance-intake
    scope: change_set
    orchestration_owner: workflow_orchestrator
    outcomes:
    - bug
    - maintenance
    - blocked
    purpose: Decide the maintenance branch before creating or loading its slice.
- id: create-change-set
  kind: agent
  name: Create an active ChangeSet when the instruction has no existing scope
  agent_id: change_set_bootstrapper
  skill_id: harness-change-set-bootstrap
  needs:
  - step: classify-maintenance-request
    outcomes:
    - succeeded
  inputs:
  - docs/changes/active
  outputs:
  - docs/changes/active/<CHG-ID>.md
  metadata:
    stage: change-set
    scope: change_set
    condition: active_change_set_missing
    orchestration_owner: workflow_orchestrator
    creation_template: .harness/docs/templates/changes/change-set.md
    purpose: Create one active ChangeSet from the original instruction before loading work-item scope. Orchestrator skips this step when an active ChangeSet already exists.
- id: load-change-set
  kind: record
  name: Load active ChangeSet and selected work item scope
  needs:
  - step: create-change-set
    outcomes:
    - succeeded
    - skipped
  inputs:
  - docs/changes/active
  metadata:
    stage: implementation
    scope: work_item
    execution_boundary: work_item
- id: create-bug-maintenance-slice
  kind: agent
  name: Create the bug maintenance document slice
  needs:
  - load-change-set
  agent_id: bug_maintenance_bootstrapper
  skill_id: harness-bug-maintenance-bootstrap
  inputs:
  - docs/changes/active/<CHG-ID>.md
  outputs:
  - docs/maintenance/<MAINT-ID>
  metadata:
    stage: maintenance-definition
    scope: maintenance
    condition: classified_as_bug
    orchestration_owner: workflow_orchestrator
- id: create-maintenance-slice
  kind: agent
  name: Create the general maintenance document slice
  needs:
  - load-change-set
  agent_id: maintenance_bootstrapper
  skill_id: harness-maintenance-bootstrap
  inputs:
  - docs/changes/active/<CHG-ID>.md
  outputs:
  - docs/maintenance/<MAINT-ID>
  metadata:
    stage: maintenance-definition
    scope: maintenance
    condition: classified_as_maintenance
    orchestration_owner: workflow_orchestrator
- id: validate-maintenance-slice
  kind: decision
  name: Validate maintenance document handoff before planning
  needs:
  - step: create-bug-maintenance-slice
    outcomes:
    - succeeded
    - skipped
  - step: create-maintenance-slice
    outcomes:
    - succeeded
    - skipped
  inputs:
  - docs/maintenance/<MAINT-ID>
  metadata:
    stage: maintenance-definition
    scope: maintenance
    orchestration_owner: workflow_orchestrator
    validator: existing-document-contracts
    required_documents:
    - index.md
    - scope.md
    - change-intent.md
    - maintenance-spec.md
    - architecture-impact.md
    - verification-goal.md
    - links.md
    purpose: Validate the specialist handoff and block planning on missing or stale maintenance evidence.
- id: maintenance-technical-decisions
  kind: agent
  name: Resolve implementation-affecting maintenance decisions when required
  needs:
  - validate-maintenance-slice
  agent_id: technical_decisions
  skill_id: harness-technical-decisions
  inputs:
  - docs/changes/active/<CHG-ID>.md
  - docs/maintenance/<MAINT-ID>
  outputs:
  - docs/maintenance/<MAINT-ID>/technical-decisions.md
  metadata:
    stage: maintenance-technical-decisions
    scope: maintenance
    condition: architecture_or_incident_or_implementation_affecting
    orchestration_owner: workflow_orchestrator
- id: plan-work-item
  kind: agent
  name: Create or update the selected work item implementation plan
  needs:
  - step: maintenance-technical-decisions
    outcomes:
    - succeeded
    - skipped
  agent_id: implementation_planner
  skill_id: harness-code-planner
  inputs:
  - docs/changes/active/<CHG-ID>.md
  - .codex/repository-settings.md
  outputs:
  - docs/plans/active/<WORK-ITEM-ID>/plan.md
  metadata:
    stage: plan-writing
    prompt_context_profile: plan
    scope: work_item
    execution_boundary: work_item
    handoff_dir: .harness/runs/<RUN-ID>/steps/<STEP-ID>
    inputs_resolved_by: work_item_document_contract
- id: review-work-item-plan
  kind: agent
  name: Review the work item implementation plan before execution
  needs:
  - plan-work-item
  agent_id: artifact_reviewer
  skill_id: harness-artifact-reviewer
  inputs:
  - docs/changes/active/<CHG-ID>.md
  - docs/plans/active/<WORK-ITEM-ID>/plan.md
  - .codex/test-gate.yaml
  outputs:
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/reviews/plan-review.md
  metadata:
    stage: plan-writing
    prompt_context_profile: review
    scope: work_item
    execution_boundary: work_item
    handoff_dir: .harness/runs/<RUN-ID>/steps/<STEP-ID>
    gate_id: plan-review
    artifact_type: plan
    inputs_resolved_by: work_item_document_contract
    review_gate:
      output: .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/reviews/plan-review.md
      status_label: Review Status
      approved_status: approved
- id: materialize-execution-scope
  kind: validator
  name: Materialize the executor's bounded plan scope
  needs:
  - review-work-item-plan
  command: python3 -m harness_codex.runtime.materialize_execution_scope --repo-root . --change-set <CHG-ID> --work-item <WORK-ITEM-ID> --plan docs/plans/active/<WORK-ITEM-ID>/plan.md --output .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/execution-scope.xml
  timeout_sec: 60
  inputs:
  - docs/plans/active/<WORK-ITEM-ID>/plan.md
  outputs:
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/execution-scope.xml
  metadata:
    stage: implementation
    scope: work_item
    execution_boundary: work_item
    gate_id: execution-scope
- id: execute-work-item
  kind: agent
  name: Execute unchecked plan tasks
  needs:
  - materialize-execution-scope
  agent_id: implementation_executor
  skill_id: harness-implementation-executor
  inputs:
  - docs/plans/active/<WORK-ITEM-ID>/plan.md
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/execution-scope.xml
  metadata:
    stage: implementation
    prompt_context_profile: execution-minimal
    scope: work_item
    execution_boundary: work_item
    handoff_dir: .harness/runs/<RUN-ID>/steps/<STEP-ID>
    upstream_context:
    - producer_step: review-work-item-plan
      artifact_path: .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/reviews/plan-review.md
      priority: high
      purpose: Review findings, approval conditions, and rejected approaches for the active plan.
- id: materialize-execution-report
  kind: validator
  name: Bind executor output to the fixed XML execution report contract
  needs:
  - execute-work-item
  command: python3 -m harness_codex.runtime.materialize_execution_report --repo-root . --scope .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/execution-scope.xml --source .harness/runs/<RUN-ID>/steps/execute-work-item/final-message.md --output .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/execution-report.xml
  timeout_sec: 60
  inputs:
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/execution-scope.xml
  - .harness/runs/<RUN-ID>/steps/execute-work-item/final-message.md
  outputs:
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/execution-report.xml
  metadata:
    stage: implementation
    scope: work_item
    execution_boundary: work_item
    gate_id: execution-report
- id: verify-work-item
  kind: validator
  name: Verify the selected work item
  needs:
  - materialize-execution-report
  command: python3 -m harness_codex.runtime.structured_verify_work_item_xml --repo-root . --change-set <CHG-ID> --work-item <WORK-ITEM-ID> --run-id <RUN-ID>
  timeout_sec: 600
  inputs:
  - docs/plans/active/<WORK-ITEM-ID>/plan.md
  - .codex/test-gate.yaml
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/execution-report.xml
  outputs:
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/verification/verification.xml
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/verification/verification.md
  metadata:
    stage: implementation
    scope: work_item
    execution_boundary: work_item
    gate_id: verification
    gate_catalog:
    - test-gate
    - full-e2e
    - runtime-server
    - browser-ui
    - static-analysis
    inputs_resolved_by: work_item_document_contract
    test_gate: .codex/test-gate.yaml required stages must PASS when applicable
- id: materialize-security-profile
  kind: validator
  name: Materialize security controls for the implemented work item review
  needs:
  - verify-work-item
  command: python3 -m harness_codex.runtime.security_review_bundle_xml profile --repo-root . --plan docs/plans/active/<WORK-ITEM-ID>/plan.md --profile-output .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-profile.xml --controls-output .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/selected-controls.xml
  timeout_sec: 60
  inputs:
  - docs/plans/active/<WORK-ITEM-ID>/plan.md
  - .codex/security/owasp-standards.json
  outputs:
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-profile.xml
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/selected-controls.xml
  metadata:
    stage: implementation
    scope: work_item
    execution_boundary: work_item
    gate_id: security-profile
- id: collect-pre-security-token-metrics
  kind: validator
  name: Collect token and prompt metrics before implementation security review
  needs:
  - materialize-security-profile
  command: python3 -m harness_codex.runtime.token_observability --repo-root . --run-id <RUN-ID> --work-item <WORK-ITEM-ID>
  timeout_sec: 60
  outputs:
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/metrics.json
  - .harness/runs/<RUN-ID>/metrics.json
  metadata:
    stage: observability
    scope: work_item
    execution_boundary: work_item
    gate_id: token-observability
- id: materialize-security-review-bundle
  kind: validator
  name: Materialize scoped implementation diff and security evidence bundle
  needs:
  - collect-pre-security-token-metrics
  command: python3 -m harness_codex.runtime.security_review_bundle_xml bundle --repo-root . --run-id <RUN-ID> --work-item <WORK-ITEM-ID> --plan docs/plans/active/<WORK-ITEM-ID>/plan.md --profile .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-profile.xml --controls .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/selected-controls.xml --verification-report .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/verification/verification.xml --verification-markdown .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/verification/verification.md --output-dir .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review-bundle
  timeout_sec: 60
  inputs:
  - docs/plans/active/<WORK-ITEM-ID>/plan.md
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-profile.xml
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/selected-controls.xml
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/verification/verification.xml
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/verification/verification.md
  outputs:
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review-bundle/manifest.xml
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review-bundle/implementation.diff
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review-bundle/security-profile.xml
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review-bundle/selected-controls.xml
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review-bundle/verification-summary.xml
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review-bundle/focused-test-summary.md
  metadata:
    stage: implementation
    scope: work_item
    execution_boundary: work_item
    gate_id: security-review-bundle
- id: review-work-item-security
  kind: agent
  name: Review the implemented code for security findings
  needs:
  - materialize-security-review-bundle
  agent_id: security_implementation_reviewer
  skill_id: harness-security-implementation-reviewer
  inputs:
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review-bundle/manifest.xml
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review-bundle/implementation.diff
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review-bundle/security-profile.xml
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review-bundle/selected-controls.xml
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review-bundle/verification-summary.xml
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review-bundle/focused-test-summary.md
  metadata:
    stage: implementation
    prompt_context_profile: review-bundle-minimal
    scope: work_item
    execution_boundary: work_item
    gate_id: security-review
    baseline: OWASP ASVS 5.0.0
    final_response_contract:
      channel: final-message
      format: markdown
      output: .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review.md
      status_label: Security Review Status
      allowed_statuses:
      - approved
      - rejected
- id: verify-work-item-security
  kind: validator
  name: Materialize and validate the implementation security review report
  needs:
  - review-work-item-security
  command: python3 -m harness_codex.runtime.materialize_security_review --source .harness/runs/<RUN-ID>/steps/review-work-item-security/final-message.md --output .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review.md --verdict-output .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review.xml
  timeout_sec: 60
  outputs:
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review.md
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review.xml
  metadata:
    stage: implementation
    scope: work_item
    execution_boundary: work_item
    gate_id: security-review
    baseline: OWASP ASVS 5.0.0
    materialized_from: .harness/runs/<RUN-ID>/steps/review-work-item-security/final-message.md
    review_gate:
      output: .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/security/security-review.md
      status_label: Security Review Status
      approved_status: approved
- id: collect-work-item-token-metrics
  kind: validator
  name: Collect final work item token and prompt metrics
  needs:
  - verify-work-item-security
  command: python3 -m harness_codex.runtime.token_observability --repo-root . --run-id <RUN-ID> --work-item <WORK-ITEM-ID>
  timeout_sec: 60
  outputs:
  - .harness/runs/<RUN-ID>/work-items/<WORK-ITEM-ID>/metrics.json
  - .harness/runs/<RUN-ID>/metrics.json
  metadata:
    stage: observability
    scope: work_item
    execution_boundary: work_item
    gate_id: token-observability
- id: complete-work-item-plan
  kind: git
  name: Move completed work item plan to completed plans
  needs:
  - collect-work-item-token-metrics
  inputs:
  - docs/plans/active/<WORK-ITEM-ID>/plan.md
  outputs:
  - docs/plans/completed/<WORK-ITEM-ID>/plan.md
  metadata:
    stage: implementation
    scope: work_item
    execution_boundary: work_item
    gate_id: verification-evidence
