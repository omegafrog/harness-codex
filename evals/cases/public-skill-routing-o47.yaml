schema_version: 1
execution_purpose: code_validation
id: public-skill-routing-o47
workflow: spec-me
dispatch_workflow: false
critical: false
required_outcome: [artifact_written]
outcome_evidence:
  artifact_written:
    actions: [write_file]
    target_prefix: .eval-output/public-skill-routing/O47.json
    required_files: [.eval-output/public-skill-routing/O47.json]
