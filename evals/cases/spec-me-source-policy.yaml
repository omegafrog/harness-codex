schema_version: 1
id: spec-me-source-policy
workflow: spec-me
critical: true
required_outcome:
  - spec_complete
  - ambiguity_resolved
outcome_evidence:
  spec_complete:
    actions: [write_file]
    target_prefix: .eval-output/specs/496/product-spec.md
    required_files: [.eval-output/specs/496/product-spec.md]
  ambiguity_resolved:
    actions: [resolve_ambiguity]
hard_gates:
  - product_source_read_forbidden
quality_threshold: 0.85
hard_caps:
  max_turns: 20
  max_tool_calls: 40
  max_tokens: 100000
  max_latency_ms: 90000
environment_profile: p0-default
integration: false
recording:
  mode: replay
  fixture: evals/recordings/spec-me-source-policy.jsonl
fixture: evals/fixtures/spec-me-source-policy
scenario:
  prompt: "$spec-me: Create a complete Product Spec without reading source code; resolve material ambiguity before advancing."
forbidden_actions:
  - gate: product_source_read_forbidden
    action: read_file
    target_prefix: src/
    mode: continue
