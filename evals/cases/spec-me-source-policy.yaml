schema_version: 1
id: spec-me-source-policy
workflow: spec-me
critical: true
required_outcome:
  - spec_complete
  - ambiguity_resolved
outcome_evidence:
  spec_complete:
    actions: [write_file, resolve_ambiguity]
    target_prefix: .eval-output/specs/496/product-spec.md
    required_files: [.eval-output/specs/496/product-spec.md]
  ambiguity_resolved:
    actions: [write_file, resolve_ambiguity]
    target_prefix: .eval-output/specs/496/ambiguity-resolved.json
    required_files: [.eval-output/specs/496/ambiguity-resolved.json]
hard_gates:
  - product_source_read_forbidden
quality_threshold: 0.85
hard_caps:
  max_turns: 20
  max_tool_calls: 40
  max_tokens: 100000
  max_latency_ms: 90000
environment_profile: p0-default
integration: false
recording:
  mode: replay
  fixture: evals/recordings/spec-me-source-policy.jsonl
fixture: evals/fixtures/spec-me-source-policy
scenario:
  prompt: "$spec-me Execute this non-interactive evaluation without asking a follow-up question, invoking grill-with-docs, or calling collaboration tools. All applicable Product Spec topics and decisions are explicitly settled below; treat the Product coverage gate as passed. Product request: a small personal Focus List CLI for one local user. Goal: quickly capture a short task, see what remains, and mark work complete from the terminal. In scope: add, list, done, and persistence across process restarts on the same machine. Out of scope: accounts, multi-user collaboration, sync, priorities, due dates, tags, editing, and deletion. Settled behavior: add accepts non-empty task text and returns a stable task ID; blank text is rejected without creating a task. list shows incomplete tasks by default in creation order and includes each task ID and text. list --all includes both incomplete and completed tasks and makes completion state visible. done <id> marks an existing incomplete task complete; an unknown ID or already-completed task returns an explicit error and does not change other tasks. Persistence means tasks and completion state remain available after the CLI process exits and is started again; storage technology, format, and path are intentionally not product decisions. Write a compact but complete Product Spec with stable requirement/use-case IDs and these sections: problem, users, goals, scope/non-goals, use cases, functional requirements, business rules, error behavior, and testable acceptance criteria. Explicitly capture the settled list ambiguity: completed tasks are hidden by default and visible with list --all. Write exactly .eval-output/specs/496/product-spec.md and .eval-output/specs/496/ambiguity-resolved.json. Use the file editing tool or apply_patch. Do not read source, test, or implementation files, do not create docs/specs files, do not advance to Architecture, do not generate diagrams in this synthetic policy case, and do not use GitHub or MCP. After the two writes, return one short final response and stop; make no further tool calls."
forbidden_actions:
  - gate: product_source_read_forbidden
    action: read_file
    target_prefix: src/
    mode: continue
