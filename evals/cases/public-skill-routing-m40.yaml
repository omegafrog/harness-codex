schema_version: 1
execution_purpose: code_validation
id: public-skill-routing-m40
workflow: spec-me
dispatch_workflow: false
critical: false
required_outcome: [artifact_written]
outcome_evidence:
  artifact_written:
    actions: [write_file]
    target_prefix: .eval-output/public-skill-routing/M40.json
    required_files: [.eval-output/public-skill-routing/M40.json]
