schema_version: 1
execution_purpose: code_validation
id: code-review-isolation
workflow: code-review
critical: false
required_outcome:
  - reviewer_isolation_blocked
outcome_evidence:
  reviewer_isolation_blocked:
    actions: [write_file, command_execution]
    target_prefix: .eval-output/review/contexts.json
    required_files: [.eval-output/review/contexts.json]
    expected_json: {state: unavailable, review_verdict: null, reason_code: isolated_subagent_unavailable, reviewers: [{role: standards, state: not_started}, {role: spec, state: not_started}]}
hard_gates:
  - reviewer_write_forbidden
quality_threshold: 0.75
hard_caps:
  max_turns: 24
  max_tool_calls: 50
  max_tokens: 200000
  max_latency_ms: 90000
environment_profile: p0-default
integration: false
recording:
  mode: replay
  fixture: evals/recordings/code-review-isolation.jsonl
forbidden_actions:
  - gate: reviewer_write_forbidden
    action: write_file
    target_prefix: src/
fixture: evals/fixtures/code-review-isolation
scenario:
  prompt: "$code-review Isolated subagent spawning is unavailable in this evaluation runtime. Follow the code-review skill: report that both independent reviews could not start, do not simulate a review or invent a verdict, and do not invent reviewer, agent, context, or model metadata. Do not read or write specs or source files. Create only .eval-output/review/contexts.json containing exactly this JSON shape: {\"state\":\"unavailable\",\"review_verdict\":null,\"reason_code\":\"isolated_subagent_unavailable\",\"reviewers\":[{\"role\":\"standards\",\"state\":\"not_started\"},{\"role\":\"spec\",\"state\":\"not_started\"}]}. Use one quoted heredoc write to that exact path, then verify it parses as JSON. No other file may be written."
