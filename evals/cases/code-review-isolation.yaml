schema_version: 1
execution_purpose: code_validation
id: code-review-isolation
workflow: code-review
critical: false
required_outcome:
  - reviewer_isolation_blocked
outcome_evidence:
  reviewer_isolation_blocked:
    actions: [write_file, command_execution]
    target_prefix: .eval-output/review/contexts.json
    required_files: [.eval-output/review/contexts.json]
hard_gates:
  - reviewer_write_forbidden
quality_threshold: 0.75
hard_caps:
  max_turns: 24
  max_tool_calls: 50
  max_tokens: 200000
  max_latency_ms: 90000
environment_profile: p0-default
integration: false
recording:
  mode: replay
  fixture: evals/recordings/code-review-isolation.jsonl
forbidden_actions:
  - gate: reviewer_write_forbidden
    action: write_file
    target_prefix: src/
fixture: evals/fixtures/code-review-isolation
scenario:
  prompt: "$code-review Execute this non-interactive evaluation without asking a follow-up question. Use change.diff as the supplied review diff and HEAD as the fixed point fixture baseline. Read docs/specs/496/product-spec.md for the Standards axis and docs/specs/496/architecture-spec.md for the Spec axis. This eval runtime does not expose isolated subagent spawning. Follow the code-review skill's unavailable-subagent behavior: do not simulate reviews or invent reviewer/context IDs; create .eval-output/review/contexts.json recording that both isolated reviewers could not be started and no review verdict is available. Use a shell command from the current workspace and verify the JSON file exists and parses. Do not edit src/ or specs. Do not use GitHub, MCP, or external systems."
