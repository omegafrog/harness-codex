# Harness observability stack v2. Spring Boot 3.4+ development runtime only.
# Load as external additional config. Keep registry/Actuator on the development classpath.
logging.structured.format.file=logstash
logging.file.name=${HARNESS_SESSION_DIR}/runtime/services/${spring.application.name}/application.jsonl
logging.structured.json.add.service=${spring.application.name}
logging.structured.json.add.environment=local
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.service=${spring.application.name}
# Existing Micrometer Tracing supplies trace/span IDs; never fabricate them.
