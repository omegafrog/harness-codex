schema_version: 1
id: spec-me
orchestrator: orchestrator
roles: [spec_document_writer, diagram_creator, architecture_review_lead, code_researcher, spec_adversarial_reviewer]
skills: [orchestrator, session-worktree, worktree-create, spec-me, product-spec, code-research, ddd-design, codebase-design, event-storming, architecture-spec, plantuml-diagrams, architecture-review, spec-review]
hooks:
  before_dispatch: [session_worktree, tracker_sync]
  before_handoff: [checkpoint_completeness, evidence_flush]
  before_complete: [tracker_sync, spec_reviews]
  after_merge: []
stages:
  - id: product
    role: spec_document_writer
    skill: product-spec
    model_tier: low
    needs: []
    gates: [product_coverage, material_ambiguity_resolved]
  - id: product_diagram
    role: diagram_creator
    skill: plantuml-diagrams
    model_tier: low
    needs: [architecture-review]
    condition: product_diagram_required
    gates: [product_diagram_completion]
  - id: define-system-targets
    role: spec_document_writer
    skill: spec-me
    model_tier: implementation
    needs: [product]
    gates: [system_targets_complete]
  - id: domain-baseline
    role: code_researcher
    skill: code-research
    model_tier: low
    needs: [product]
  - id: architecture
    role: spec_document_writer
    skill: architecture-spec
    model_tier: low
    needs: [product, define-system-targets, domain-baseline]
    gates: [architecture_coverage]
  - id: review-architecture-decisions
    role: architecture_review_lead
    skill: architecture-review
    model_tier: high_performance
    needs: [architecture]
    condition: learning_mode
    gates: []
  - id: verify-architecture-decisions
    role: spec_document_writer
    skill: spec-me
    model_tier: low
    needs: [architecture, review-architecture-decisions]
    gates: [decision_evidence_complete, decision_review_complete]
  - id: architecture_diagram
    role: diagram_creator
    skill: plantuml-diagrams
    model_tier: low
    needs: [architecture-review]
    condition: architecture_diagram_required
    gates: [architecture_diagram_completion]
  - id: architecture-review
    role: spec_adversarial_reviewer
    skill: spec-review
    model_tier: high_performance
    needs: [architecture, verify-architecture-decisions]
    gates: [architecture_adversarial_review]
