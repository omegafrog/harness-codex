schema_version: 1
id: to-ticket
orchestrator: orchestrator
roles: [to_ticket, plan_reviewer]
skills: [orchestrator, beads, worktree-create, to-ticket, plan-review]
hooks:
  before_dispatch: [dependency, resource_conflict, workspace, permission_preflight, spec_reviews]
  before_handoff: [checkpoint_completeness, evidence_flush]
  before_complete: [tracker_sync, required_outcome, evidence, plans_index, spec_reviews, plan_review]
  after_merge: []
stages:
  - id: plan_split
    role: to_ticket
    skill: to-ticket
    model_tier: high_performance
    needs: []
  - id: plan_review
    role: plan_reviewer
    skill: plan-review
    model_tier: high_performance
    needs: [plan_split]
  - id: plan_revision
    role: to_ticket
    skill: to-ticket
    model_tier: high_performance
    needs: [plan_split, plan_review]
  - id: plan_finalize
    role: to_ticket
    skill: to-ticket
    model_tier: high_performance
    needs: [plan_split, plan_review]
