schema_version: 1
id: code-review
orchestrator: orchestrator
roles: [standards_reviewer, spec_reviewer]
skills: [orchestrator, code-review]
hooks:
  before_dispatch: [dependency, resource_conflict, workspace, tracker_sync, permission_preflight]
  before_handoff: [checkpoint_completeness, evidence_flush]
  before_complete: [tracker_sync, review, evidence]
  after_merge: []
stages:
  - id: standards
    role: standards_reviewer
    skill: code-review
    model_tier: implementation
    needs: []
  - id: spec
    role: spec_reviewer
    skill: code-review
    model_tier: implementation
    needs: []
