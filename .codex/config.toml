[agents]
max_threads = 4
max_depth = 2

[agents.requirements_interviewer]
description = "Derive requirements through iterative questions"
config_file = "agents/requirements_interviewer.toml"

[agents.orchestration]
description = "Route one ChangeSet through bounded workflow steps"
config_file = "agents/orchestration.toml"

[agents.changeset_workspace]
description = "새 ChangeSet의 origin/main 기반 sibling worktree를 생성"
config_file = "agents/changeset_workspace.toml"

[agents.changeset_pr]
description = "wiki 완료 ChangeSet branch를 push하고 PR을 생성"
config_file = "agents/changeset_pr.toml"

[agents.maintenance_intake_specialist]
description = "Create ChangeSet and maintenance intake documents"
config_file = "agents/maintenance_intake_specialist.toml"

[agents.ubiquitous_language_reviewer]
description = "Confirm ubiquitous language after requirements are stable"
config_file = "agents/ubiquitous_language_reviewer.toml"

[agents.harness_usecases]
description = "Derive external-actor use cases from confirmed requirements"
config_file = "agents/harness_usecases.toml"

[agents.oracle]
description = "유스케이스별 이벤트 스토밍을 확정"
config_file = "agents/oracle.toml"

[agents.ddd_architect]
description = "이벤트 스토밍으로 UC별 후보 DDD 설계 생성"
config_file = "agents/ddd_architect.toml"

[agents.ddd_design_integrator]
description = "다중 UC 후보 DDD 설계를 ChangeSet DDD architecture로 통합"
config_file = "agents/ddd_design_integrator.toml"

[agents.technical_decisions]
description = "구현을 막는 기술 문제의 해결 확정"
config_file = "agents/technical_decisions.toml"

[agents.implementation_planner]
description = "ChangeSet 구현 계획 생성"
config_file = "agents/implementation_planner.toml"

[agents.security_plan_reviewer]
description = "Review active implementation plans and add applicable OWASP security tasks"
config_file = "agents/security_plan_reviewer.toml"

[agents.implementation_executor]
description = "Implement active plan tasks without replanning"
config_file = "agents/implementation_executor.toml"

[agents.artifact_reviewer]
description = "Review critical workflow artifacts before downstream execution"
config_file = "agents/artifact_reviewer.toml"

[agents.wiki_source_scanner]
description = "검증된 ChangeSet과 영향 경로에서 wiki 근거를 수집"
config_file = "agents/wiki_source_scanner.toml"

[agents.wiki_writer]
description = "검증 근거로 프로젝트 전체 한국어 wiki를 갱신"
config_file = "agents/wiki_writer.toml"

[agents.wiki_mkdocs_manager]
description = "wiki MkDocs 설정과 스크립트를 갱신"
config_file = "agents/wiki_mkdocs_manager.toml"

[agents.wiki_installer]
description = "root venv에 wiki 의존성을 설치"
config_file = "agents/wiki_installer.toml"

[agents.wiki_verifier]
description = "OpenAPI, 링크, MkDocs strict build를 검증"
config_file = "agents/wiki_verifier.toml"

[agents.wiki_committer]
description = "검증된 wiki 변경만 한국어 커밋"
config_file = "agents/wiki_committer.toml"
