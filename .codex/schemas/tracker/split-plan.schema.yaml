schema_version: 1
id: split-plan
type: object
additional_properties: false
required: [schema_version, kind, plan_id, issue, parent_issue, status, purpose, scope, acceptance_criteria, test_contract, specs]
properties:
  schema_version: { type: integer, const: 1 }
  kind: { type: string, const: split-plan }
  plan_id: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$" }
  issue: { type: integer, minimum: 1 }
  parent_issue: { type: integer, minimum: 1 }
  status: { type: string, const: Planned }
  purpose: { type: string }
  scope: { type: array, min_items: 1, items: { type: string, min_length: 1 } }
  acceptance_criteria: { type: array, min_items: 1, items: { type: string, min_length: 1 } }
  test_contract:
    type: object
    additional_properties: false
    required: [unit_policy, ui_entity_e2e]
    properties:
      unit_policy: { type: string, min_length: 1 }
      ui_entity_e2e: { type: string, min_length: 1 }
  dependencies: { type: array, items: { type: integer, minimum: 1 } }
  specs:
    type: object
    additional_properties: false
    required: [product_spec, architecture_spec]
    properties:
      product_spec: { type: string, min_length: 1 }
      architecture_spec: { type: string, min_length: 1 }
  diagrams:
    type: array
    items:
      type: object
      additional_properties: false
      required: [name, kind, path]
      properties:
        name: { type: string, min_length: 1 }
        kind: { type: string, min_length: 1 }
        path: { type: string, min_length: 1 }
        url: { type: string, min_length: 1 }
