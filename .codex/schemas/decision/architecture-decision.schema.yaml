schema_version: 2
id: architecture-decision
type: object
required: [schema_version, id, status, category, problem, constraints, requirement_ids, target_ids, options, selected_option, rationale, tradeoffs, boundary, criteria, evaluations, selection, review_mode]
properties:
  schema_version: { type: integer, const: 2 }
  id: { type: string }
  status: { type: string, enum: [proposed, held, accepted] }
  category: { type: string, enum: [code, infrastructure] }
  problem: { type: string }
  constraints: { type: array, items: { type: string } }
  requirement_ids: { type: array, items: { type: string } }
  target_ids: { type: array, items: { type: string } }
  options: { type: array, items: { type: object, required: [id, description], properties: { id: { type: string }, description: { type: string } } } }
  single_option_reason: { type: string }
  selected_option: { type: string }
  rejected_alternatives: { type: array, items: { type: object, required: [option_id, reason], properties: { option_id: { type: string }, reason: { type: string } } } }
  rationale: { type: string }
  tradeoffs: { type: array, items: { type: string } }
  boundary: { type: string }
  criteria:
    type: array
    items:
      type: object
      required: [id, requirement_id, condition, kind, priority]
      properties:
        id: { type: string }
        requirement_id: { type: string }
        condition: { type: string }
        kind: { type: string, enum: [required, preferred] }
        priority: { type: string }
  evaluations:
    type: array
    items:
      type: object
      required: [option_id, criterion_id, result, reason, evidence_kind, condition]
      properties:
        option_id: { type: string }
        criterion_id: { type: string }
        result: { type: string, enum: [met, unmet, unknown] }
        reason: { type: string }
        evidence_kind: { type: string, enum: [measured, external_measurement, documented, estimated, unknown] }
        source: { type: string }
        claim_ids: { type: array, items: { type: string }, description: Stored knowledge Claims (knowledge/claims) a documented evaluation cites; required when evidence_kind is documented. }
        condition: { type: string }
        checked_at: { type: string, format: date-time }
  selection:
    type: object
    required: [decision, accepted_tradeoffs, uncertainty, revisit_when, user_choice]
    properties:
      decision: { type: string }
      accepted_tradeoffs: { type: string }
      uncertainty: { type: string }
      revisit_when: { type: string }
      user_choice: { type: string }
  principle_ids: { type: array, items: { type: string } }
  evidence_ids: { type: array, items: { type: string } }
  review_id: { type: string }
  review_mode: { type: string, enum: [Normal, Learning] }
  approval: { type: object, required: [approver, approved_at, subject_hash], properties: { approver: { type: string }, approved_at: { type: string }, subject_hash: { type: string } } }
