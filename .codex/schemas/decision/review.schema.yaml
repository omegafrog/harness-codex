schema_version: 2
id: architecture-review
type: object
additional_properties: false
required: [schema_version, id, decision_id, reviewer, assessment, outcome, findings]
properties:
  schema_version: { type: integer, const: 2 }
  id: { type: string, min_length: 1 }
  decision_id: { type: string, min_length: 1 }
  reviewer: { type: string, min_length: 1 }
  assessment: { type: string, min_length: 1 }
  outcome: { type: string, enum: [ACCEPTED, NEEDS_DEFENSE, NEEDS_EVIDENCE, NEEDS_REVISION] }
  findings:
    type: array
    items:
      type: object
      required: [severity, description, evidence]
      properties:
        severity: { type: string, enum: [blocker, major, minor] }
        description: { type: string, min_length: 1 }
        evidence: { type: string, min_length: 1 }
