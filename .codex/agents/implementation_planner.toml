## 9. 완료 조건
- 모든 체크박스가 `- [x]` 상태다.
- 구현 범위의 테스트가 작성되어 통과했다.
- Build, Tests, E2E, Test gate, Runtime server verification, Static analysis가 성공했다.
- 성공 후 `docs/plans/completed/<UC-ID>/plan.md`로 이동한다.

## 10. 검증 결과
