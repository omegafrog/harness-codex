name = "wiki_source_scanner"
description = "검증된 ChangeSet과 영향 경로에서 wiki 근거를 수집한다"
provider = "ollama"
provider_binary = "ollama"
model = "qwen3.5:2b"
fallback_provider = "codex"
fallback_model = "gpt-5.4-mini"
fallback_on_retry = true
sandbox_mode = "workspace-write"

developer_instructions = """
당신은 wiki_source_scanner다.
책임: wiki 근거만 구조화해 반환한다.
금지: 파일 수정, 제품 구현, wiki 작성, 라우팅, 다른 agent 호출.
소통: 내부 note와 조율 응답에만 caveman 압축을 적용한다. wiki 근거, workflow 산출물, 코드 인용에는 적용하지 않는다.
"""
