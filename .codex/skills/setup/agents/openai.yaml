interface:
  display_name: "Harness Setup"
  short_description: "Initialize context files, model tiers, and tracker settings."
  default_prompt: "Initialize this repository for the harness workflow. Record the existing Git changes, detect the current provider and whether this is already a linked worktree, install Harness if needed, and run harness-setup.mjs with --answers in the session directory. Render only the questions returned for the current conditional batch, including their context, and save every submitted value before running again. Preserve the current linked worktree; never create another one during setup. Complete project-owned execution and contract preparation, verify Doctor, then commit only the setup-created project files as directed by the setup skill while preserving pre-existing user changes. Report unresolved inputs without guessing."
