interface:
  display_name: "Harness Setup"
  short_description: "Initialize context files, model tiers, and tracker settings."
  default_prompt: "Initialize this repository for the harness workflow. Record existing Git changes, detect the provider and linked worktree, install Harness if needed, and start harness-setup.mjs with --start. Use its returned answers_path for subsequent calls. Display ui_questions exactly once per conditional batch, bind the accepted call with --bind-ui using this conversation's rollout, and record each actual reply immediately with --receive. Use --status; advance without asking for extra input only when can_continue is true. Answer interruption or explanation requests first, persist --cancel when stopped, and never resume from late replies. Preserve the current linked worktree. Complete project-owned preparation, verify Doctor, then commit only setup-created project files as directed by the skill, preserving pre-existing changes. Report unresolved inputs without guessing."
