name: Behavioral Eval

on:
  pull_request:
    paths:
      - ".agents/**"
      - ".codex/**"
      - "AGENTS.md"
      - "CONTEXT.md"
      - "CONTEXT-MAP.md"
      - "bin/**"
      - "src/**"
      - "evals/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/behavioral-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  behavioral-eval:
    name: Behavioral Eval (p0)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Codex authentication
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "CODEX_AUTH_JSON secret is required for Behavioral Eval." >&2
            exit 1
          fi
          mkdir -p "$HOME/.codex"
          printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"

      - name: Run P0 Behavioral Eval
        run: node ./bin/harness-eval.mjs run --suite p0

      - name: Upload Behavioral Eval artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-eval-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex/evals/.runtime/**
          if-no-files-found: warn
          retention-days: 14
