name: Bump runtime version after main update

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bump-runtime-version-main
  cancel-in-progress: false

jobs:
  bump-version:
    if: >-
      ${{ !startsWith(github.event.head_commit.message, 'chore: 런타임 패치 버전 자동 증가') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out updated main branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.VERSION_BUMP_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Bump runtime patch version
        run: python3 scripts/bump_runtime_version.py

      - name: Commit bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f harness_codex/__init__.py
          git commit -m "chore: 런타임 패치 버전 자동 증가"
          git push origin HEAD:main
