name: Harness contracts
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test compose/worktree runtime
        run: node --test tests/worktree_record_contract.test.mjs
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check canonical contracts and revision
        env:
          CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          base_args=()
          if [[ -n "$CONTRACT_BASE" && ! "$CONTRACT_BASE" =~ ^0+$ ]]; then
            base_args=(--base-ref "$CONTRACT_BASE")
          fi
          if [[ -f .harness/contracts.mjs ]]; then
            node .harness/contracts.mjs check --root "$GITHUB_WORKSPACE" "${base_args[@]}"
          else
            node .codex/scripts/harness-contracts.mjs check --root "$GITHUB_WORKSPACE" "${base_args[@]}"
          fi
