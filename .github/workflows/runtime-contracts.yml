name: Runtime document contracts

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  runtime-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Run full runtime and workflow test suite
        run: |
          set +e
          python -m pytest -q > pytest-output.log 2>&1
          status=$?
          tail -n 200 pytest-output.log
          exit $status
      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.log
          if-no-files-found: error
