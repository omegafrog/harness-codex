name: Runtime document contracts

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  memory-schema-and-retrieval:
    name: Memory schema and retrieval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Run memory schema and retrieval unit suite
        run: |
          python -m pytest -q \
            tests/runtime/memory/test_schema_and_writer.py \
            tests/runtime/memory/test_retrieval_and_precedence.py

  memory-prompt-contract:
    name: Memory prompt injection contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Run prompt injection boundary suite
        run: |
          python -m pytest -q \
            tests/runtime/memory/test_prompt_injection.py \
            tests/runtime/test_prompt_builder.py

  evolution-memory-integration:
    name: Evolution to memory integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Run evolution persistence suite
        run: |
          python -m pytest -q \
            tests/runtime/evolution/test_memory_sync.py \
            tests/runtime/test_evolution.py

  memory-public-cli-e2e:
    name: Public memory CLI end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Run real public CLI process suite
        run: |
          python -m pytest -q \
            tests/runtime/evolution/test_memory_cli_e2e.py \
            tests/runtime/test_memory.py \
            tests/test_public_workflow_cli.py

  full-runtime-regression:
    name: Full runtime and workflow regression
    needs:
      - memory-schema-and-retrieval
      - memory-prompt-contract
      - evolution-memory-integration
      - memory-public-cli-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml
      - name: Run full runtime and workflow test suite
        run: |
          set +e
          python -m pytest -q > pytest-output.log 2>&1
          status=$?
          tail -n 200 pytest-output.log
          exit $status
      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.log
          if-no-files-found: error
