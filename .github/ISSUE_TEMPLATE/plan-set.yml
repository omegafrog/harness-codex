name: Plan Set
description: Create a structured parent Issue for an approved plan set.
title: "[Plan Set] "
labels: [plan-set]
body:
  - type: markdown
    attributes:
      value: |
        `harness-codex`는 검증된 plan-set object에서 canonical Issue body를 렌더링한다.
        아래 입력은 `Plan Set`, `목적`, `실행 순서`, `명세와 다이어그램`, `의존성`, `검증` 섹션에 대응한다.
  - type: input
    id: plan-set-id
    attributes:
      label: Plan Set ID
      description: Stable plan-set identifier.
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
    validations:
      required: true
  - type: textarea
    id: children
    attributes:
      label: Child plans
      description: 사람이 읽기 위한 미리보기다. canonical 값은 아래 Structured source에 함께 넣고 검증한다.
      placeholder: "- issue: 501\n  plan_id: journal\n  title: ...\n  summary: ...\n  depends_on: []"
    validations:
      required: true
  - type: textarea
    id: execution-order
    attributes:
      label: Execution order
      description: 사람이 읽기 위한 미리보기다. canonical 값은 아래 Structured source의 execution_order에 넣는다.
      placeholder: "501, 502"
    validations:
      required: true
  - type: textarea
    id: specs
    attributes:
      label: Specs
      description: 사람이 읽기 위한 미리보기다. canonical 값은 아래 Structured source의 specs에 넣는다.
      placeholder: "product_spec: docs/specs/<ticket-id>/product-spec.md\narchitecture_spec: docs/specs/<ticket-id>/architecture-spec.md"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: 사람이 읽기 위한 미리보기다. canonical 값은 아래 Structured source의 depends_on에 넣는다.
      placeholder: "501 → 502 또는 없음"
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: 사람이 읽기 위한 미리보기다. canonical 값은 아래 Structured source의 verification에 넣는다.
    validations:
      required: true
  - type: textarea
    id: diagrams
    attributes:
      label: Diagrams
      description: 사람이 읽기 위한 미리보기다. canonical 값은 아래 Structured source의 diagrams에 넣는다.
      placeholder: "해당 없음 — 적용 가능한 ticket-scoped SVG가 없음"
    validations:
      required: true
  - type: textarea
    id: structured-source
    attributes:
      label: Structured source
      description: 이 필드가 유일한 canonical 입력이다. YAML/JSON plan-set object를 넣고 GitHub mutation 전에 `validatePlanSetSource`와 `renderPlanSetIssue`를 순서대로 통과시킨다.
      placeholder: "schema_version: 1\nkind: plan-set\nid: plan-1\n..."
    validations:
      required: true
